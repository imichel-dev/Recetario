<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recetario</title>
<meta name="description" content="Recetas propias y calculadora de porcentaje panadero, con uso sin conexión.">
<meta name="theme-color" content="#EFE6D2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="iconos/favicon.png">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<link rel="preload" href="fuentes/figtree.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fuentes/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/estilos.css">
<script>
  // Aplica el tema antes de dibujar, para evitar un parpadeo de color.
  try {
    var d = JSON.parse(localStorage.getItem('recetario.v1') || '{}');
    var t = (d.ajustes && d.ajustes.tema) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro');
    document.documentElement.dataset.tema = t;
  } catch (e) {}
</script>
</head>
<body>
<div id="app"></div>
<input type="file" id="archivo" accept=".json,application/json" hidden>
<dialog id="dialogo"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">Esta aplicación necesita JavaScript activado.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
